<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  shape-rendering="geometricPrecision"
>
  <defs>
    <linearGradient id="vendiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6fed" />
      <stop offset="55%" stop-color="#4c8dff" />
      <stop offset="100%" stop-color="#155ee0" />
    </linearGradient>
    <filter id="vendiaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="blur" />
      <feOffset in="blur" dx="0" dy="30" result="offsetBlur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo cuadrado redondeado (icono de app) -->
  <rect
    x="48"
    y="48"
    width="928"
    height="928"
    rx="260"
    ry="260"
    fill="url(#vendiaGrad)"
    filter="url(#vendiaShadow)"
  />

  <!-- Sombra interna sutil para volumen -->
  <path
    d="M48 48 h928 v928 H48 z"
    fill="none"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="10"
    rx="250"
    ry="250"
    paint-order="stroke"
  />

  <!-- Marca "V" blanca estilo check/bolsa -->
  <path
    d="M230 520 L370 790 L512 540 L654 790 L794 520 L794 230 L512 630 L230 230 Z"
    fill="#ffffff"
    fill-rule="evenodd"
  />

  <!-- Detalle luminoso en el cruce inferior de la V -->
  <path
    d="M460 520 L512 630 L564 520"
    fill="#ffffff"
    fill-opacity="0.55"
  />
</svg>
