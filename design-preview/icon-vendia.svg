<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  shape-rendering="geometricPrecision"
>
  <defs>
    <linearGradient id="vendiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6fed" />
      <stop offset="50%" stop-color="#4c8dff" />
      <stop offset="100%" stop-color="#155ee0" />
    </linearGradient>
    <filter id="vendiaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32" result="blur" />
      <feOffset in="blur" dx="0" dy="34" result="offsetBlur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo squircle azul -->
  <rect x="48" y="48" width="928" height="928" rx="240" ry="240" fill="url(#vendiaGrad)" filter="url(#vendiaShadow)" />

  <!-- Borde interno sutil -->
  <path d="M48 48 h928 v928 H48 z" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="14" rx="228" ry="228" paint-order="stroke" />

  <!-- V azul oscuro -->
  <path
    d="M236 236 L512 720 L788 236"
    fill="none"
    stroke="#155ee0"
    stroke-width="104"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rayo blanco cruzando la V -->
  <path
    d="M396 284 L596 316 L436 720 L636 684 L556 284 Z"
    fill="#ffffff"
  />
</svg>
