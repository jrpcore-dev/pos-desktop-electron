<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="azul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#155ee0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo cuadrado redondeado azul -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#azul)" filter="url(#sombra)"/>

  <!-- V azul oscuro -->
  <path d="M118 118 L256 360 L394 118" fill="none" stroke="#0d3b66" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rayo negro dentro de la V -->
  <path d="M198 142 L298 158 L218 360 L318 342 L278 142 Z" fill="#0b1526"/>
</svg>
